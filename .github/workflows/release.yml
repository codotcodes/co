name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/check-version.sh "$GITHUB_REF_NAME"
      - run: python3 scripts/test-release-notes.py
      - run: cargo publish --locked --dry-run

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-4vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
          - os: blacksmith-4vcpu-ubuntu-2404
            target: x86_64-unknown-linux-musl
            musl: true
          - os: blacksmith-4vcpu-ubuntu-2404-arm
            target: aarch64-unknown-linux-gnu
          - os: blacksmith-4vcpu-ubuntu-2404-arm
            target: aarch64-unknown-linux-musl
            musl: true
          # Blacksmith macOS is ARM64-only; retain the native Intel build.
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: blacksmith-6vcpu-macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Configure native musl linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
      - name: Preserve Apple Silicon macOS compatibility
        if: matrix.target == 'aarch64-apple-darwin'
        run: echo 'MACOSX_DEPLOYMENT_TARGET=14.0' >> "$GITHUB_ENV"
      - run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Package
        shell: bash
        run: |
          asset="co-${{ matrix.target }}.tar.gz"
          mkdir dist stage
          cp "target/${{ matrix.target }}/release/co" stage/co
          cp README.md LICENSE-MIT LICENSE-APACHE stage/
          tar -C stage -czf "dist/$asset" .
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$asset" > "$asset.sha256")
          else
            (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
          fi
      - uses: actions/setup-go@v7
        if: matrix.musl
        with:
          go-version: stable
      - name: Build distribution packages
        if: matrix.musl
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          sh scripts/package-linux.sh "$GITHUB_REF_NAME" "${{ matrix.target }}" "target/${{ matrix.target }}/release/co" dist
          for package in dist/*.deb dist/*.rpm dist/*.pkg.tar.zst; do
            (cd dist && sha256sum "$(basename "$package")" > "$(basename "$package").sha256")
          done
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: co-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  package-smoke:
    needs: build
    strategy:
      matrix:
        include:
          - os: blacksmith-4vcpu-ubuntu-2404
            target: x86_64-unknown-linux-musl
          - os: blacksmith-4vcpu-ubuntu-2404-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: co-${{ matrix.target }}
          path: dist
      - run: cd dist && sha256sum -c ./*.sha256
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
      - run: sh scripts/test-packages.sh dist "$GITHUB_REF_NAME"

  windows:
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: ./scripts/test-windows.ps1
      - run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Build checksum-bound Windows packages
        run: |
          python scripts/test-windows-packages.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/windows-packages.py archive $env:GITHUB_REF_NAME target/x86_64-pc-windows-msvc/release/co.exe $env:GITHUB_SHA dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/windows-packages.py manifests $env:GITHUB_REF_NAME dist windows-metadata
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          choco pack windows-metadata/chocolatey/co-codes-cli.nuspec --outputdirectory dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item windows-metadata/co-codes-cli.json,windows-metadata/co-winget.zip,windows-metadata/windows-packages.json dist
          Get-ChildItem dist -File | Where-Object { $_.Extension -ne '.sha256' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }
      - name: Require native manager lifecycle checks before publication
        run: ./scripts/test-windows-managers.ps1 -Version $env:GITHUB_REF_NAME
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: co-x86_64-pc-windows-msvc
          path: dist/*
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-evidence
          path: |
            ${{ runner.temp }}/co-test-*/*.log
            ${{ runner.temp }}/co-packages-*/*.log
          if-no-files-found: warn

  github-release:
    needs: [build, package-smoke, windows]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: co-*
          merge-multiple: true
      - name: Generate versioned Homebrew formula
        run: |
          python3 scripts/homebrew-formula.py "$GITHUB_REF_NAME" dist > dist/co.rb
          (cd dist && sha256sum co.rb > co.rb.sha256)
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/co.rb
      - name: Extract curated release notes
        run: python3 scripts/release-notes.py "$GITHUB_REF_NAME" > release-notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-file release-notes.md --title "co $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

  crates-io:
    needs: [build, package-smoke, windows]
    if: vars.PUBLISH_CRATES_IO == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
