name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/check-version.sh "$GITHUB_REF_NAME"
      - run: cargo publish --locked --dry-run

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Configure native musl linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
      - run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Package
        shell: bash
        run: |
          asset="co-${{ matrix.target }}.tar.gz"
          mkdir dist stage
          cp "target/${{ matrix.target }}/release/co" stage/co
          cp README.md LICENSE-MIT LICENSE-APACHE stage/
          tar -C stage -czf "dist/$asset" .
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$asset" > "$asset.sha256")
          else
            (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
          fi
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/co-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: co-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "co $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

  crates-io:
    needs: build
    if: vars.PUBLISH_CRATES_IO == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
