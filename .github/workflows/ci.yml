name: CI

on:
  pull_request:
  push:
    branches: [main, "review/windows-**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-runtime:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --test tests/*.test.mjs

  go:
    name: Go (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      matrix:
        os:
          [
            blacksmith-4vcpu-ubuntu-2404,
            blacksmith-6vcpu-macos-15,
            windows-2025,
          ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test -race ./... -count=1
      - if: runner.os == 'Windows'
        run: ./scripts/test-windows.ps1
      - if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-runtime-evidence
          path: ${{ runner.temp }}/co-test-*/*.log
          if-no-files-found: warn

  installer:
    strategy:
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, blacksmith-6vcpu-macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - if: runner.os == 'macOS'
        run: brew install shellcheck
      - run: shellcheck install.sh scripts/*.sh
      - run: sh -n install.sh scripts/*.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: sh scripts/test-installer.sh

  homebrew:
    strategy:
      matrix:
        # Blacksmith macOS is ARM64-only; retain native Intel coverage.
        os: [blacksmith-6vcpu-macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: brew tap codotcodes/co "$GITHUB_WORKSPACE"
      - run: brew install codotcodes/co/co
      - run: brew test codotcodes/co/co
      - run: brew reinstall codotcodes/co/co
      - run: co version
      - run: brew uninstall codotcodes/co/co

  packages:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
      - run: sh scripts/build.sh x86_64-unknown-linux-musl build/co
      - run: |
          version="$(sh scripts/version.sh)"
          sh scripts/package-linux.sh "$version" x86_64-unknown-linux-musl build/co dist
          sh scripts/test-packages.sh dist "$version"

  nix:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix flake check
      - run: nix build
      - run: ./result/bin/co version

  windows-packages:
    needs: go
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - shell: bash
        run: sh scripts/build.sh x86_64-pc-windows-msvc build/co.exe
      - name: Build and test the exact native Windows archive
        run: |
          $version = (Select-String '^var Version = "([^"]+)"' internal/cli/version.go).Matches[0].Groups[1].Value
          python scripts/test-windows-packages.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/windows-packages.py archive $version build/co.exe $env:GITHUB_SHA dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/test-windows-managers.ps1 -Version $version
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-package-evidence
          path: |
            dist/*
            ${{ runner.temp }}/co-packages-*/*.log
            ${{ runner.temp }}/co-packages-*/new/**
            ${{ runner.temp }}/co-packages-*/feed/*.nupkg
          if-no-files-found: warn
