[package]
name = "co-codes-cli"
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
description = "Human-facing CLI for co.codes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codotcodes/co"
homepage = "https://co.codes"
readme = "README.md"
keywords = ["git", "cli", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "co"
path = "src/main.rs"

[[test]]
name = "workflow"
path = "tests/workflow.rs"
harness = false

[dependencies]
base64 = "0.22"
fs2 = "0.4"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
webbrowser = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
