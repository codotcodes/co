[package]
name = "co-codes-cli"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Human-facing CLI for co.codes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codotcodes/co"
homepage = "https://co.codes"
readme = "README.md"
keywords = ["git", "cli", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "co"
path = "src/main.rs"

[dependencies]
fs2 = "0.4"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webbrowser = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
